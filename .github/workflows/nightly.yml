name: Nightly Full Tests

on:
  schedule:
    # Run at 2am UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: "Nightly suite or measurement suite"
        required: true
        type: choice
        default: full-test
        options:
          - full-test
          - pr-linux
          - macos-short
          - macos-candidates
          - linux-integration
          - linux-integration-sharded
          - linux-integration-hybrid-sharded
          - linux-integration-hybrid-16-sharded
          - linux-integration-hybrid-prebuilt-sharded
          - linux-integration-coverage
          - cross-version-smoke
          - nix
          - mcp-package
          - npm-package
      smoke_version:
        description: "Optional previous release for cross-version-smoke"
        required: false
        default: ""

env:
  BD_DISABLE_METRICS: "1"
  BD_DISABLE_EVENT_FLUSH: "1"

jobs:
  measure:
    name: Measure selected CI suite
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite != 'full-test' }}
    uses: ./.github/workflows/ci-measurements.yml
    with:
      suite: ${{ inputs.suite }}
      smoke_version: ${{ inputs.smoke_version }}

  full-test:
    name: Full Test Suite
    if: ${{ github.event_name == 'schedule' || inputs.suite == 'full-test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install Dolt
        run: |
          ./scripts/ci/install-dolt.sh

      - name: Configure Git and Dolt identity
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@beads.test"
          dolt config --global --add user.name "CI Bot"
          dolt config --global --add user.email "ci@beads.test"

      - name: Pull Dolt sql-server image for deletion contract
        run: ./scripts/ci/pull-dolt-image.sh

      - name: Build
        run: go build -v -tags gms_pure_go ./cmd/bd

      # This server-backed contract is distinct from domain/UOW and must not
      # be counted as validated when TestMain cannot start its Docker fixture.
      - name: Test server-backed deletion contract (Docker SQL, no skips)
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          trap 'rm -f -- "$report"' EXIT
          go test -json -tags gms_pure_go -race -count=1 -timeout 15m -run '^TestDeleterContract$' ./internal/storage/dolt/ | tee "$report"
          python3 - "$report" <<'PY_AUDIT'
          import json
          import sys
          from pathlib import Path

          events = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines()]
          package = "github.com/rhar1511/beads/internal/storage/dolt"
          terminal = {event.get("Test", ""): event["Action"] for event in events
                      if event.get("Package") == package and event["Action"] in {"pass", "fail", "skip"}}
          required = {"", "TestDeleterContract"} | {
              "TestDeleterContract/" + case for case in
              ("ProtectsActiveReferences", "ProtectsOnlySurvivingOwners", "FencesOpenTargetWispOwner")
          }
          if not all(terminal.get(test) == "pass" for test in required):
              raise SystemExit("Docker SQL deletion contract did not actually pass all required roots")
          if any(action in {"skip", "fail"} for action in terminal.values()):
              raise SystemExit("Docker SQL deletion contract skipped or failed a selected case")
          print(f"Verified Docker SQL deletion contract: {len(terminal) - 2} subtests passed, zero skips")
          PY_AUDIT

      - name: Full Test Suite (including integration tests)
        env:
          # Skip Docker-based Dolt testcontainer tests — they hang in
          # GitHub Actions (known issue, see scripts/repro-dolt-hang/).
          # Non-Docker integration tests still run via the installed dolt binary.
          BEADS_TEST_SKIP: dolt
          BEADS_TEST_BD_BINARY: ${{ github.workspace }}/bd
          # Prevent detached Dolt metrics processes racing temporary-directory cleanup.
          DOLT_DISABLE_EVENT_FLUSH: "1"
        run: |
          # The CLI conformance fixtures own native Dolt processes. Limit their
          # opt-in to cmd/bd: other packages use Docker-backed shared servers.
          package_list=$(go list -tags=integration,gms_pure_go ./...)
          other_packages=()
          while IFS= read -r package; do
            if [[ "$package" != "github.com/rhar1511/beads/cmd/bd" ]]; then
              other_packages+=("$package")
            fi
          done <<< "$package_list"
          test "${#other_packages[@]}" -gt 0
          BEADS_TEST_ENV_RUN_DOLT=1 go test -v -race -tags=integration,gms_pure_go -coverprofile=coverage-cli.out -timeout=30m ./cmd/bd
          go test -v -race -tags=integration,gms_pure_go -coverprofile=coverage-packages.out -timeout=30m "${other_packages[@]}"
          {
            head -n 1 coverage-cli.out
            tail -n +2 coverage-cli.out
            tail -n +2 coverage-packages.out
          } > coverage.out

      - name: Check coverage threshold
        run: |
          set -euo pipefail
          COVERAGE=$(go tool cover -func=coverage.out | awk '$1 == "total:" {print $3}')
          if ! [[ "$COVERAGE" =~ ^[0-9]+([.][0-9]+)?%$ ]]; then
            echo "Invalid or ambiguous aggregate coverage: $COVERAGE" >&2
            exit 1
          fi
          COVERAGE=${COVERAGE%\%}
          echo "Coverage: $COVERAGE%"
          # Threshold is lower (30%) because Docker-based Dolt integration
          # tests are skipped in CI (BEADS_TEST_SKIP=dolt). With Docker
          # tests included, coverage would be ~50%+.
          if awk -v coverage="$COVERAGE" 'BEGIN {exit !(coverage < 30)}'; then
            echo "❌ Coverage is below 30% threshold"
            exit 1
          elif awk -v coverage="$COVERAGE" 'BEGIN {exit !(coverage < 40)}'; then
            echo "⚠️  Coverage is below 40% (warning threshold)"
          else
            echo "✅ Coverage meets threshold"
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        if: success()
        continue-on-error: true
        with:
          file: ./coverage.out
          fail_ci_if_error: false
